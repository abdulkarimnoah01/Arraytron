<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Arraytron Stamp: seal with a rubber stamp</title>
  <desc id="description">The Arraytron double-ring seal. A rubber stamp above two cubes and a sphere that it has just printed, joined by dashed construction lines.</desc>
  <g id="seal" stroke="#000" fill="none">
    <circle id="white-field" cx="512" cy="512" r="446" fill="#fff" stroke="none"/>
    <circle cx="512" cy="512" r="446" stroke-width="9"/>
    <circle cx="512" cy="512" r="426" stroke-width="3.5"/>
  </g>
  <g id="construction" fill="none" stroke="#000" stroke-width="3" stroke-dasharray="9 11">
    <path d="M 400 470 L 320 668"/>
    <path d="M 512 470 L 512 692"/>
    <path d="M 624 470 L 704 668"/>
  </g>
  <g id="stamp" stroke="#000" stroke-width="10" fill="#fff" stroke-linejoin="round">
    <rect x="442" y="150" width="140" height="160" rx="62"/>
    <path d="M 478 310 L 546 310 L 566 392 L 458 392 Z"/>
    <rect x="332" y="392" width="360" height="78" rx="16"/>
    <path d="M 332 440 L 692 440" stroke-width="4" fill="none"/>
  </g>
  <g id="prints" stroke="#000" stroke-width="9" fill="#fff" stroke-linejoin="round">
    <path d="M 320 600 L 395 643 L 395 730 L 320 773 L 245 730 L 245 643 Z"/>
    <path d="M 245 643 L 320 686 L 395 643 M 320 686 L 320 773" fill="none" stroke-width="5"/>
    <circle cx="512" cy="742" r="52"/>
    <path d="M 704 600 L 779 643 L 779 730 L 704 773 L 629 730 L 629 643 Z"/>
    <path d="M 629 643 L 704 686 L 779 643 M 704 686 L 704 773" fill="none" stroke-width="5"/>
  </g>
</svg>
